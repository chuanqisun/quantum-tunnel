<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Tunnel</title>
  </head>
  <body>
    <div id="source-link">
      <a href="https://github.com/chuanqisun/quantum-tunnel" target="_blank" rel="noopener noreferrer">SOURCE_CODE</a>
    </div>

    <div id="ui-layer">
      <h1>QUANTUM_TUNNEL v7.2.1</h1>
      <p id="status-text">MOVE TO EXPLORE</p>
      <div class="mode-selector">
        <button id="mouseMode" class="active">MANUAL Mode</button>
        <button id="eyeMode">HUD Mode</button>
      </div>
    </div>

    <div id="liveView" class="invisible">
      <video id="webcam" autoplay playsinline></video>
      <div class="fps-counter"></div>
      <div id="eye-controls">
        <button id="calibrateButton">Calibrate</button>
      </div>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script type="module" src="src/hud.js"></script>
  </body>
</html>
