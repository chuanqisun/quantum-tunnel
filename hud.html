<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sci-Fi HUD Parallax Stack</title>
    <style>
      body {
        background-color: #020508;
        color: #00f2ff;
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Courier New", Courier, monospace;
      }

      #ui-layer {
        position: absolute;
        top: 20px;
        z-index: 10;
        pointer-events: none;
        text-align: center;
        width: 100%;
      }

      h1 {
        margin: 0;
        font-size: 1.2em;
        letter-spacing: 4px;
      }

      p {
        margin: 5px 0 15px 0;
        font-size: 0.8em;
        opacity: 0.7;
      }

      button {
        background: rgba(0, 242, 255, 0.1);
        border: 1px solid #00f2ff;
        color: #00f2ff;
        padding: 10px 20px;
        cursor: pointer;
        pointer-events: auto;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s;
      }

      button:hover {
        background: #00f2ff;
        color: #000;
        box-shadow: 0 0 15px #00f2ff;
      }

      #canvas-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 5;
        opacity: 0.3;
      }

      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: #00f2ff;
      }

      #crosshair::before {
        width: 40px;
        height: 1px;
        left: -20px;
        top: 0;
      }

      #crosshair::after {
        width: 1px;
        height: 40px;
        left: 0;
        top: -20px;
      }
    </style>
  </head>
  <body>
    <div id="ui-layer">
      <h1>QUANTUM_HUD v7.2.1</h1>
      <p>MOVE MOUSE FROM CENTER TO EXPLODE VIEW</p>
      <button id="regen">Generate</button>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script type="module" src="src/hud.js"></script>
  </body>
</html>
